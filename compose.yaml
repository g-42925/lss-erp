services:
  nextjs:
    image: node:22-alpine
    container_name: nextjs-local
    working_dir: /app
    volumes:
      - /home/iqbal/Projects/web/lss-erp:/app
      - nextjs_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  nextjs_node_modules:
